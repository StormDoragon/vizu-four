name: Secrets and What-If
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a deploy token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN is not set" 1>&2
            exit 1
          fi
          echo "Deploying with token: $DEPLOY_TOKEN"

      - name: Use a var for the target environment
        run: echo "Deploying to ${{ vars.DEPLOY_ENV }}"
